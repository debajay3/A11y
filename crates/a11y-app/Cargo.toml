[package]
name = "a11y-app"
description = "a11y desktop editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "a11y"
path = "src/main.rs"

[features]
default = ["open-url", "enhanced-desktop"]
enhanced-desktop = []
# Opens Present links in the system browser (after a confirmation).
open-url = ["dep:open"]
# Plays H.264 video fills in Present through Cisco's OpenH264 (C++ sources compiled by the
# `openh264` crate, so it needs a C++ compiler). Off by default: the default build stays pure Rust
# and still plays Motion JPEG; other codecs show their poster with an "Unsupported codec" badge.
video = ["dep:openh264"]

[dependencies]
open = { version = "5", optional = true }
openh264 = { version = "0.9", optional = true }
a11y-doc.workspace = true
a11y-engine.workspace = true
a11y-render.workspace = true
a11y-fig.workspace = true
a11y-library.workspace = true
a11y-fonts.workspace = true
a11y-export.workspace = true
a11y-svg.workspace = true
a11y-pen.workspace = true
a11y-gpu.workspace = true
a11y-mcp.workspace = true
a11y-collab.workspace = true
a11y-net.workspace = true
arboard = "3"
eframe = "0.35.0"
rfd = "0.17.2"
image = { workspace = true, features = ["jpeg", "webp"] }
cosmic-text = "0.19.0"
unicode-segmentation = "1"
serde_json.workspace = true
serde.workspace = true
ureq = "2"
semver = "1"
sha2 = "0.11"
ed25519-dalek = "3"
# the portable Windows zip is unpacked in process (the same features a11y-fig uses)
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
roxmltree = "0.20"
egui = "0.35"
resvg = { version = "0.45", default-features = false }
base64 = "0.22"

# Finder and browser opens arrive as Apple events (see src/macos.rs); the versions winit uses.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSData", "NSString"] }

# The OpenRouter key for AI images lives in the OS credential store (see src/aiimg/keys.rs).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gif = { version = "0.14", default-features = false, features = ["std"] }
