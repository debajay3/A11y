[package]
name = "a11y-svg"
description = "SVG import for a11y: maps a usvg tree onto a11y nodes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
a11y-doc.workspace = true
a11y-fonts = { path = "../a11y-fonts", default-features = false }
a11y-render.workspace = true
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
roxmltree = "0.20"
thiserror.workspace = true
usvg = { version = "0.45", default-features = false, features = ["text"] }

[dev-dependencies]
base64 = "0.22"
a11y-fonts = { path = "../a11y-fonts", default-features = false }
a11y-export.workspace = true
resvg = { version = "0.45", default-features = false, features = ["text"] }
tiny-skia.workspace = true
