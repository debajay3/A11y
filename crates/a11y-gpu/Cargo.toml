[package]
name = "a11y-gpu"
description = "GPU canvas renderer (wgpu + lyon) for a11y documents; the CPU renderer stays the deterministic reference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
a11y-doc.workspace = true
a11y-render.workspace = true
lyon_tessellation = "1"
pollster = "0.4"
wgpu = "29"

[dev-dependencies]
a11y-diff = { path = "../a11y-diff" }
image.workspace = true
