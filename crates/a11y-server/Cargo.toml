[package]
name = "a11y-server"
description = "Headless always-on host for live collaboration: keeps a .a11y file shared permanently"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "a11y_server"
path = "src/lib.rs"

[[bin]]
name = "a11y-server"
path = "src/main.rs"

[dependencies]
a11y-auth = { path = "../a11y-auth" }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }

a11y-doc.workspace = true
a11y-collab.workspace = true
a11y-net.workspace = true
a11y-library.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "signal"] }

[[bin]]
name = "a11y-library-server"
path = "src/workspace_main.rs"
